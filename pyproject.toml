[project]
name = "llm-agent-for-ai-studio"
version = "0.1.0"
description = "Multi-agent MVP for designing one-prompt and RAG applications in Yandex AI Studio"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.1",
    "aiofiles>=25.1.0",
    "cryptography>=48.0.1",
    "openai>=2.32.0",
    "openai-agents>=0.14.3",
    "pyyaml>=6.0.3",
    "streamlit>=1.59.1",
    "aiogram>=3.30.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "ty>=0.0.31",
]

[tool.ty.src]
exclude = ["uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "yandex_ai_studio_e2e: opt-in credentialed tests that call Yandex AI Studio",
]
