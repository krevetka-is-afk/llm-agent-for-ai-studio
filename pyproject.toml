[project]
name = "llm-agent-for-ai-studio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chatkit>=0.0.1",
    "dotenv>=0.9.9",
    "langchain-core>=1.3.2",
    "langchain-openai>=1.2.1",
    "openai>=2.32.0",
    "openai-agents>=0.14.3",
    "openai-chatkit>=1.6.3",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "ty>=0.0.31",
]

[tool.ty.src]
exclude = ["uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
