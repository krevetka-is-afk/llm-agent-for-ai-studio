services:
  oauth-gateway:
    profiles: ["oauth-experimental"]
    build: .
    command: ["python", "-m", "experimental.oauth.app"]
    env_file: .env.gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - oauth-credentials:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  telegram-bot:
    profiles: ["telegram-experimental"]
    build: .
    command: ["python", "app.py"]
    env_file: .env.bot
    restart: unless-stopped
    volumes:
      - bot-data:/data

  web-ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--browser.gatherUsageStats=false"]
    env_file: .env.web
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - web-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  oauth-credentials:
  bot-data:
  web-data:
