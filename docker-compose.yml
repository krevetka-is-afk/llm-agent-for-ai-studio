services:
  oauth-gateway:
    profiles: ["oauth-experimental"]
    build: .
    command: ["python", "-m", "experimental.oauth.app"]
    env_file: .env.gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - oauth-credentials:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  telegram-bot:
    profiles: ["telegram-experimental"]
    build: .
    command: ["python", "app.py"]
    env_file: .env.bot
    restart: unless-stopped

  web-ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--browser.gatherUsageStats=false"]
    env_file: .env.web
    environment:
      PYTHONPATH: /app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - api-key-credentials:/data

volumes:
  oauth-credentials:
  api-key-credentials:
